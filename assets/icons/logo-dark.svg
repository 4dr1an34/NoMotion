      <path d="M0 15 Q 15 -5 30 15 T 60 15 T 85 15 L 120 15" stroke="#00B4D8" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <circle cx="120" cy="15" r="4" fill="#00B4D8" />
      <line x1="130" y1="15" x2="480" y2="15" stroke="#111827" stroke-width="1.8" stroke-dasharray="4 2.5" opacity="0.35" />
    </g>
    <!-- Wordmark -->
    <g transform="translate(0, 58)">
      <text x="0" y="0" font-family="'Stack Sans Notch', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="300" fill="#111827" letter-spacing="-0.01em">no</text>
      <text x="56" y="0" font-family="'Stack Sans Notch', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="800" fill="#111827" letter-spacing="0.08em">MOTION</text>
      <text x="2" y="22" font-family="'Bitcount Single', monospace" font-size="10" font-weight="700" fill="#4B5563" letter-spacing="0.32em">0 HZ ACTIVE PHASE CANCELLATION</text>
